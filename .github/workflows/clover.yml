name: Clover (manual)

# ============================================================================
# The live card-payment specs, run on demand against a DEPLOYED environment.
#
# ── WHY THESE ARE NOT IN CI ───────────────────────────────────────────────
#
# Four spec files cover the Clover integration — real card payments, a real
# merchant account. As of 2026-08-22 they ran NOWHERE automatically, which made
# them the least-verified part of the most consequential code in the repo.
#
# They cannot simply be added to `test:e2e:ci`, and it is worth writing down why
# so nobody tries. They authenticate as PRODUCTION WorkOS identities. Both the
# local suite and the CI job run on STAGING keys — `_workos-keys.ts` requires
# `sk_test_…` and refuses everything else, deliberately, so that a developer
# with production keys exported cannot create staff accounts on the live
# environment. `tests/e2e/_fixtures.ts` therefore makes every Clover fixture
# resolve EMPTY on any localhost base URL, and the CI job sets
# `E2E_BASE_URL=http://localhost:3000`.
#
# So adding them to the CI list would change nothing: they would skip there too.
# `facility-shell` is already in that list, already uses `deployedFixture`, and
# its remote-only test was observed skipping in CI on 2026-08-22. Do NOT "fix"
# this by loosening the gate in `_fixtures.ts` — that reinstates the bug it was
# written to close, where eight spec files failed at sign-in with "Invalid
# credentials" and looked like application faults rather than a wrong
# environment.
#
# What was actually missing is this file: something that RUNS them.
#
# ── WHY DISPATCH AND NOT A SCHEDULE ───────────────────────────────────────
#
# Only one of the four is safely repeatable, so a nightly run of all four would
# be wrong:
#
#   clover-pay       REPEATABLE, and self-sufficient since 2026-08-22: it
#                    CREATES its own booking as staff and cancels it in
#                    afterAll. It uses Clover's documented DECLINE card
#                    (4264 2815 1111 7771) — the charge is genuinely attempted
#                    (SDK, iframes, tokenisation, /v1/charges) and genuinely
#                    refused, so nothing is captured and the balance it sets up
#                    is the balance it tears down.
#
#                    It used to read CLOVER_E2E_BOOKING_REF, a booking made by
#                    hand that everybody hoped stayed unpaid. The first run
#                    after the WorkOS migration found it "Paid in full", and no
#                    booking at that facility had a balance at all — so the
#                    variable is gone and the spec now needs the STAFF email
#                    instead, to create what it pays.
#
#   clover-platform  Read-only status endpoint. Repeatable, but SPLIT ACROSS
#                    ENVIRONMENTS — see the caveat below.
#
#   clover-refund    SINGLE SHOT. It gives real money back and leaves the
#                    booking fully refunded; it cannot run twice against the
#                    same charge. Somebody must make a fresh payment and point
#                    CLOVER_E2E_REFUND_BOOKING_REF at it first.
#
#   clover-terminal  Needs a physical terminal's serial number. Hardware. This
#                    will never be automatic and must not be counted as
#                    coverage.
#
# Start by dispatching `clover-pay`. A schedule for that one alone is the
# obvious follow-up once it has been seen green here.
#
# ── CAVEAT: clover-platform CANNOT BE FULLY GREEN ON EITHER ENVIRONMENT ───
#
# Its four tests need two different identities. "tells a platform admin what is
# configured" signs in as ACCOUNTS.admin (admin@yipyy.dev), provisioned into
# STAGING by scripts/provision-e2e-identities.ts. Two others sign in as
# CLOVER_E2E_STAFF_EMAIL, a PRODUCTION identity. So on production the admin test
# is expected to fail at sign-in, and on staging the staff tests skip. Unlike
# the staff tests, the admin one carries no `test.skip` guard, so it FAILS
# rather than skipping.
#
# That is a defect in the spec rather than in this workflow, and it is recorded
# here rather than worked around: a `--grep-invert` hiding it would make the run
# look green while covering less.
# ============================================================================

on:
  workflow_dispatch:
    inputs:
      specs:
        description: "Which Clover spec to run"
        type: choice
        default: clover-pay
        options:
          - clover-pay
          - clover-platform
          - clover-refund
          - clover-terminal
      base_url:
        description: "Deployment to run against (NOT localhost)"
        type: string
        default: https://www.yipyy.com

concurrency:
  group: clover-${{ github.ref }}
  cancel-in-progress: false

jobs:
  clover:
    name: clover
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2

      # Everything that can be wrong is wrong HERE, in one line each, rather
      # than as a sign-in timeout thirty seconds into a browser run.
      - name: Preflight
        env:
          BASE_URL: ${{ inputs.base_url }}
          SPECS: ${{ inputs.specs }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
          WORKOS_API_KEY: ${{ secrets.WORKOS_API_KEY }}
          WORKOS_CLIENT_ID: ${{ secrets.WORKOS_CLIENT_ID }}
          CLOVER_E2E_CUSTOMER_EMAIL: ${{ secrets.CLOVER_E2E_CUSTOMER_EMAIL }}
          CLOVER_E2E_STAFF_EMAIL: ${{ secrets.CLOVER_E2E_STAFF_EMAIL }}
          CLOVER_E2E_BOOKING_REF: ${{ secrets.CLOVER_E2E_BOOKING_REF }}
          CLOVER_E2E_REFUND_BOOKING_REF: ${{ secrets.CLOVER_E2E_REFUND_BOOKING_REF }}
          CLOVER_E2E_TERMINAL_SERIAL: ${{ secrets.CLOVER_E2E_TERMINAL_SERIAL }}
          CLOVER_E2E_TERMINAL_BOOKING_REF: ${{ secrets.CLOVER_E2E_TERMINAL_BOOKING_REF }}
        run: |
          fail() { echo "::error::$1"; exit 1; }

          # A localhost base makes every Clover fixture resolve empty, so every
          # test would SKIP and the run would report success having proved
          # nothing. That is the exact failure this workflow exists to end.
          case "$BASE_URL" in
            *localhost*|*127.0.0.1*)
              fail "base_url is localhost. Every Clover fixture resolves empty on a local base, so the run would skip everything and still report success. Point this at a deployed environment." ;;
            https://*) ;;
            *) fail "base_url must be an https:// URL." ;;
          esac

          [ -n "$E2E_PASSWORD" ] || fail "Missing secret: E2E_PASSWORD"
          [ -n "$WORKOS_CLIENT_ID" ] || fail "Missing secret: WORKOS_CLIENT_ID"
          [ -n "$WORKOS_API_KEY" ] || fail "Missing secret: WORKOS_API_KEY"

          # The harness demands a staging key even for a remote run, because
          # playwright.config.ts calls applyWorkosTestKeys() unconditionally at
          # load. It is NOT what authenticates: signIn drives the browser
          # sign-in form, so the DEPLOYED app authenticates against its own
          # WorkOS environment. The key is a precondition, not a credential —
          # and it must still be the staging one.
          case "$WORKOS_API_KEY" in
            sk_test_*) ;;
            *) fail "WORKOS_API_KEY must be the STAGING key (sk_test_...). The suite refuses anything else; see tests/e2e/_workos-keys.ts." ;;
          esac

          need() {
            eval "value=\${$1}"
            [ -n "$value" ] || fail "Missing secret: $1 (required by $SPECS)"
          }

          case "$SPECS" in
            clover-pay)
              need CLOVER_E2E_CUSTOMER_EMAIL
              need CLOVER_E2E_STAFF_EMAIL
              ;;
            clover-platform)
              need CLOVER_E2E_STAFF_EMAIL
              echo "::warning::clover-platform cannot be fully green on one environment. Its platform-admin test signs in as admin@yipyy.dev, a STAGING identity, and carries no skip guard - expect that one test to fail against production. See this workflow's header."
              ;;
            clover-refund)
              need CLOVER_E2E_CUSTOMER_EMAIL
              need CLOVER_E2E_STAFF_EMAIL
              need CLOVER_E2E_REFUND_BOOKING_REF
              echo "::warning::clover-refund is SINGLE SHOT. It refunds real money and consumes CLOVER_E2E_REFUND_BOOKING_REF. Re-running without a fresh charge will fail."
              ;;
            clover-terminal)
              need CLOVER_E2E_STAFF_EMAIL
              need CLOVER_E2E_TERMINAL_SERIAL
              need CLOVER_E2E_TERMINAL_BOOKING_REF
              echo "::warning::clover-terminal needs a PHYSICAL terminal at that serial, powered on and reachable."
              ;;
          esac

          echo "Preflight OK - $SPECS against $BASE_URL"

      - run: bun install --frozen-lockfile

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      # No build and no server: this runs against a deployment that already
      # exists, which is the whole reason it is quick.
      - name: Run
        env:
          E2E_BASE_URL: ${{ inputs.base_url }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
          WORKOS_API_KEY: ${{ secrets.WORKOS_API_KEY }}
          WORKOS_CLIENT_ID: ${{ secrets.WORKOS_CLIENT_ID }}
          CLOVER_E2E_CUSTOMER_EMAIL: ${{ secrets.CLOVER_E2E_CUSTOMER_EMAIL }}
          CLOVER_E2E_STAFF_EMAIL: ${{ secrets.CLOVER_E2E_STAFF_EMAIL }}
          CLOVER_E2E_BOOKING_REF: ${{ secrets.CLOVER_E2E_BOOKING_REF }}
          CLOVER_E2E_REFUND_BOOKING_REF: ${{ secrets.CLOVER_E2E_REFUND_BOOKING_REF }}
          CLOVER_E2E_TERMINAL_SERIAL: ${{ secrets.CLOVER_E2E_TERMINAL_SERIAL }}
          CLOVER_E2E_TERMINAL_BOOKING_REF: ${{ secrets.CLOVER_E2E_TERMINAL_BOOKING_REF }}
        run: bunx playwright test "${{ inputs.specs }}" --reporter=line

      # A run that skipped everything is the failure this file is about, so the
      # outcome is printed rather than left to be eyeballed in the log.
      - name: Run summary
        if: always()
        run: |
          if [ -f test-results/.last-run.json ]; then
            cat test-results/.last-run.json
          else
            echo "No run summary file; see the step above."
          fi

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: clover-report-${{ inputs.specs }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
