name: CI

# `develop` is the integration branch and the default PR target; `main` is
# release-only. Both are protected and require typecheck/lint/format/build, so
# both must appear here — a protected branch whose required checks never run
# blocks every merge into it, permanently and with no obvious cause.
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  # The full 59-spec suite, nightly. 03:00 UTC is after the working day in both
  # timezones this is developed in and before the Clover sweep's busiest window.
  schedule:
    - cron: "0 3 * * *"
  # And on demand, for the push you want the whole suite to see before it lands.
  workflow_dispatch:

# ── A RUN ON `main` IS NEVER CANCELLED ──────────────────────────────────────
#
# `cancel-in-progress: true` everywhere was actively dangerous once `main`
# started deploying, and it was already costing something before that:
#
#   1. It would kill the deploy job MID-SSH — quite possibly between "started
#      the new container" and "pointed Caddy at it" — leaving the box in a state
#      no script knows how to describe.
#   2. It cancels the e2e job, which skips `afterAll`, which leaks rows into the
#      one shared production Postgres. The next run's failure then looks like an
#      application bug. That has happened twice.
#
# With `false`, a second push to `main` QUEUES behind the first rather than
# killing it — runs stay serialised, which is what the shared database needs,
# and no job is ever interrupted halfway. Feature branches still cancel, because
# there the only cost is CI minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile

      - name: Restore ESLint cache
        uses: actions/cache@v4
        with:
          path: .eslintcache
          key: eslint-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            eslint-${{ runner.os }}-

      - run: bun run lint

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run format:check

  # ── THE PURE-LOGIC TESTS ──────────────────────────────────────────────────
  #
  # A third tier, added 2026-08-28, and deliberately a small one. Everything
  # else here is either static analysis over the source or a real browser
  # against a real Postgres. Neither could have caught what created this job.
  #
  # `DataTable`'s sort comparator, shared by ~88 screens, ordered every numeric
  # column LEXICOGRAPHICALLY -- $125 ahead of $38, 1000 ahead of 250. It was
  # found by eye on the HQ training price column, having shipped that way for
  # months. Nothing failed. A sorted-wrongly table is indistinguishable from a
  # sorted-rightly one unless you read the numbers.
  #
  # Static analysis cannot see it: the code was well-typed and well-formed. An
  # e2e spec could, but only by seeding rows of a particular digit-length shape
  # into the one shared production database in order to assert something three
  # layers below the screen -- slow, flaky, and leaks rows when cancelled.
  #
  # So: pure functions, no React, no DOM, no database, no secrets. Under a
  # second for the whole tier. `bunfig.toml` scopes `bun test` to tests/unit so
  # it never wanders into the Playwright specs, which end in .spec.ts too.
  #
  # This is for logic that is worth being sure of and cheap to isolate -- a
  # comparator, money arithmetic, a date window. It is NOT a place to move
  # coverage that belongs against the real database; RLS, permissions and
  # payments stay in Playwright, where they can actually be wrong.
  unit:
    name: unit (pure logic)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run test:unit

  # ── THE PROJECT'S OWN RULES ────────────────────────────────────────────────
  #
  # Fourteen `check:*` scripts live in package.json. Each one exists because a
  # specific mistake was made and cost something: a route that took its facility
  # from the request body, an update that could not tell an RLS refusal from a
  # no-op, a screen that said "Saved" with nothing behind it, a dialog with a
  # 1024px floor on a 390px phone, a doc quoting a spec count that went stale
  # four times.
  #
  # Until now NONE of them ran anywhere but on a developer's machine, by hand,
  # when that developer remembered. Which is the same shape as the SQL tests
  # before 2026-08-22: the appearance of a gate. Every rule this repo has
  # written down three times and broken a fifth was catchable by one of these
  # and caught by none of them.
  #
  # ── WHY ONE JOB AND NOT FOURTEEN ──────────────────────────────────────────
  #
  # They are static analysis over `src/` — no build, no browser, no database, no
  # secrets. The whole set is seconds. Fourteen jobs would be fourteen installs
  # to save nothing, and fourteen entries to add to branch protection instead of
  # one.
  #
  # ── AND WHY IT RUNS ALL OF THEM BEFORE FAILING ────────────────────────────
  #
  # `set -e` would stop at the first, so a change that broke three rules would
  # take three pushes to discover. Each script's own output is printed as it
  # runs, failures are collected, and the job reports every one of them at the
  # end. `::error::` puts each on the summary page rather than only in the log.
  checks:
    name: checks (the project's own rules)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile

      - name: Run every check:* script
        run: |
          failed=""
          for script in \
            pricing \
            rls-writes \
            grooming-menu \
            settings-wiring \
            settings-seeding \
            settings-fixture \
            quickbooks \
            dialog-widths \
            nav-parity \
            customer-identity \
            facility-from-session \
            link-origin \
            redirect-origin \
            success-claims \
            passkey-email-verified \
            migration-versions \
            automation-triggers \
            no-review-gating \
            vendor-strings \
            doc-counts
          do
            echo "::group::check:$script"
            if bun run "check:$script"; then
              echo "::endgroup::"
            else
              echo "::endgroup::"
              echo "::error::check:$script failed"
              failed="$failed $script"
            fi
          done
          if [ -n "$failed" ]; then
            echo ""
            echo "Failed:$failed"
            echo "Each of these runs locally with: bun run check:<name>"
            exit 1
          fi
          # Deliberately not a number. It said "14" while the loop above ran
          # 15, which is the same stale-count problem check:doc-counts exists
          # to end — and a count nobody derives is a count that drifts.
          echo "Every check above passed."

  build:
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile

      - name: Restore Next.js cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            nextjs-${{ runner.os }}-

      - run: bun run build

  # ── THE DATABASE TESTS ────────────────────────────────────────────────────
  #
  # 41 files in supabase/tests/, and until 2026-08-22 NOTHING ran any of them —
  # not CI, not a package script, not a hook. They were hand-run, and evidently
  # had not been for weeks. On their first automated run: 368 passed, 23 failed,
  # 7 could not run at all.
  #
  # That is not a tidiness problem. `rpc-session-required.sql` contains V7, a
  # sweep written SPECIFICALLY so that a new SECURITY DEFINER function which
  # forgets to revoke `anon` fails a test rather than reaching production. It
  # had been failing, unread, naming eleven functions — three of them existence
  # oracles and one with no permission check at all. A rule this repo has
  # written down in three places was broken a fifth time while the test that
  # catches it sat green-in-nobody's-eyes on disk.
  #
  # A test nobody runs is worse than no test: it is the APPEARANCE of a gate.
  # This job is the difference.
  #
  # ── THESE RUN AGAINST THE REAL DATABASE, AND ROLL BACK ────────────────────
  #
  # There is one Postgres and this points at it. Every file seeds real rows into
  # real tables — facilities, memberships, staff, bookings — because that is the
  # only way to test RLS, which is the authorisation boundary this product rests
  # on. What makes it safe is that scripts/run-sql-tests.ts owns the transaction
  # rather than trusting the file: it STRIPS each file's own `begin`/`rollback`,
  # wraps the body in its own transaction, and aborts it unconditionally. A file
  # that forgot its rollback still cannot commit, and one whose shape it does
  # not recognise is refused rather than run.
  #
  # `cancel-in-progress` above is therefore safe here in a way it is not for the
  # browser tests: a cancelled connection aborts its transaction, so a killed
  # SQL run leaves nothing behind. It has no `afterAll` to skip.
  #
  # ── WHY IT IS CHEAP ───────────────────────────────────────────────────────
  #
  # No build, no browser, no server. Install and connect. The whole suite is
  # ~90 seconds, against ~18 minutes for the browser job — which is the argument
  # for it gating rather than reporting.
  sql:
    name: sql (RLS, grants & database invariants)
    runs-on: ubuntu-latest
    # Secrets are not available to forked pull requests, so the job would fail
    # for a reason that has nothing to do with the change.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2

      # Fail here, in one line, rather than 41 identical connection errors.
      # Same rule as the e2e preflight below.
      - name: Check the connection string is configured
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::Missing repository secret: SUPABASE_DB_URL"
            echo "Add it under Settings -> Secrets and variables -> Actions."
            echo "It is the Postgres connection string from Supabase under"
            echo "Project Settings -> Database -> Connection string. Use the"
            echo "SESSION pooler or the direct connection - both port 5432."
            echo "The publishable and service-role keys will NOT do: they reach"
            echo "PostgREST, which cannot hold a session open across begin and"
            echo "rollback, and that rollback is the only reason these tests are"
            echo "safe to run against a real database."
            exit 1
          fi
          case "$SUPABASE_DB_URL" in
            *:6543/*|*:6543)
              echo "::error::That is the TRANSACTION pooler (port 6543)."
              echo "It hands out a different backend per statement, which breaks"
              echo "both prepared statements and the session-level transaction"
              echo "these tests depend on. Use the SESSION pooler or the direct"
              echo "connection - both are port 5432."
              exit 1 ;;
          esac
          echo "Connection string present, and not the transaction pooler."

      - run: bun install --frozen-lockfile

      - name: Run the SQL tests
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: bun run test:sql

  # ── THE BROWSER TESTS ──────────────────────────────────────────────────────
  #
  # Everything above proves the code COMPILES, is formatted and has no type
  # errors. None of it proves the app behaves. Every authorisation guard in this
  # repo — a groomer refused /facility, `manage_staff` unable to mint an owner,
  # an invited hire routed to their checklist, the header naming the person
  # actually signed in — was verified by somebody running Playwright by hand.
  #
  # Which means the realistic regression looks like this: a change loosens
  # `canAccessFacilityPortal`, typecheck/lint/format/build all go green, the PR
  # merges, and every staff member can reach the facility admin portal again
  # with nothing anywhere saying so.
  #
  # ── WHY A SUBSET, AND WHY IT GREW ─────────────────────────────────────────
  #
  # 53 spec files exist. This runs 21: the 10 that cover AUTHORISATION AND
  # IDENTITY, and the 11 of the DAILY OPERATIONS cluster.
  #
  # The operations specs were left out on the argument that they "fail loudly
  # the moment somebody opens the screen", so a human would notice. Running them
  # for the first time on 2026-08-20 disproved that in an afternoon. They found:
  #
  #   * POST /api/bookings answering 500 on production — `bookings.ref` is
  #     `generated BY DEFAULT as identity`, so a seeded explicit ref left the
  #     sequence behind and the next booking collided. Intermittent-looking,
  #     because a failed insert still burns the number.
  #   * A checkout priced with no late fee whenever the settings query had not
  #     landed yet — silent, and only sometimes.
  #   * A late-fee assertion that only held in a Toronto afternoon, so CI (UTC)
  #     would never have agreed with a developer's laptop.
  #   * A PostgREST to-one relation read as an array, which yields undefined for
  #     every row and an empty board with no error anywhere.
  #
  # None of those are things a human notices by opening the screen. Two of them
  # are money. The trade is about eight minutes a PR.
  #
  # The list lives in `bun run test:e2e:ci` rather than here, so the command CI
  # runs is the command anybody can run locally, unchanged.
  #
  # ── WHY A BUILT SERVER AND NOT `bun run dev` ─────────────────────────────
  #
  # playwright.config.ts starts `bun run dev`, which compiles routes on first
  # hit; the same 59 tests take minutes longer that way and the first navigation
  # to each route is a coin flip against the 120s timeout. Measured on a built
  # server: 59 tests, 4m09s, one skip, zero failures.
  #
  # `E2E_BASE_URL=http://localhost:3000` suppresses the config's webServer block
  # so this job owns the server. It does NOT make the run "remote":
  # tests/e2e/_fixtures.ts treats a localhost base as local on purpose, so the
  # eight production-identity specs keep skipping honestly instead of failing at
  # sign-in against staging keys.
  #
  # ── THESE TESTS TOUCH THE REAL DATABASE ──────────────────────────────────
  #
  # There is one Postgres. A localhost server still talks to it, so this subset
  # was checked for write-cleanliness before being put on every PR: counts for
  # facilities, memberships, clients, pets, bookings, profiles, platform team
  # and role overrides were identical before and after a full run. Anything
  # added to `test:e2e:ci` must clean up after itself the way
  # role-editor-writes.spec.ts does.
  # ── SPLIT 2026-08-25: THE GATE RUNS ON EVERY PUSH, THE REST NIGHTLY ──────
  #
  # 59 specs is ~45 minutes, and GitHub holds only ONE pending run per branch —
  # so with two people pushing to main, each new push cancelled the previously
  # QUEUED run and nothing finished. Commits went unverified and production
  # drifted from main, not because a test failed but because no test ever got
  # to run. The suite length was the cause; everything else was a symptom.
  #
  # So this job now runs the 12 specs that guard the two things worth blocking
  # a push over: the authorisation boundary, and money. The other 47 still run,
  # nightly and on demand, in the e2e-full job below — the coverage is not
  # dropped, it is rescheduled.
  e2e:
    name: e2e (access & money; full suite nightly)
    runs-on: ubuntu-latest
    # 21 specs now, not 10. Measured locally: auth ~4 min, operations ~8 min,
    # plus install and a build. 30 left no room for a slow runner.
    #
    # NOTE this job is NOT one of the four required status checks (typecheck,
    # lint, format, build). It reports; it does not gate — and pushes go
    # straight to main anyway. Run `bun run test:e2e:ci` BEFORE pushing.
    timeout-minutes: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 50 || 25 }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2

      # Fail here, with the list, rather than 59 identical sign-in timeouts.
      # Absent keys failing loudly is the same rule tests/e2e/_workos-keys.ts
      # applies — a suite that cannot authenticate should say so in one line.
      - name: Check the required secrets are configured
        env:
          WORKOS_API_KEY: ${{ secrets.WORKOS_API_KEY }}
          WORKOS_CLIENT_ID: ${{ secrets.WORKOS_CLIENT_ID }}
          WORKOS_COOKIE_PASSWORD: ${{ secrets.WORKOS_COOKIE_PASSWORD }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
        run: |
          missing=""
          for name in WORKOS_API_KEY WORKOS_CLIENT_ID WORKOS_COOKIE_PASSWORD \
                      NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY \
                      SUPABASE_SERVICE_ROLE_KEY E2E_PASSWORD; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing"
            echo "Add them under Settings → Secrets and variables → Actions."
            echo "WORKOS_API_KEY must be the STAGING key (sk_test_…) — the suite"
            echo "refuses anything else, so a production key fails here too."
            exit 1
          fi
          case "$WORKOS_API_KEY" in
            sk_test_*) ;;
            *) echo "::error::WORKOS_API_KEY is not a staging key (sk_test_…)."
               echo "The e2e accounts live in the WorkOS Staging environment;"
               echo "a production key would try to create them on the live one."
               exit 1 ;;
          esac
          echo "All seven secrets present."

      - run: bun install --frozen-lockfile

      - name: Restore Next.js cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextjs-e2e-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            nextjs-e2e-${{ runner.os }}-
            nextjs-${{ runner.os }}-

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      - name: Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_WORKOS_REDIRECT_URI: http://localhost:3000/auth/callback
          NEXT_PUBLIC_APP_DOMAIN: yipyy.test
          # ── DO NOT ADD WORKOS_COOKIE_DOMAIN HERE ──────────────────────────
          #
          # It is tempting, to make `host-routing.spec.ts` exercise the
          # cross-host redirects the way production does. It breaks the ENTIRE
          # suite: AuthKit would set the session cookie for `.yipyy.test`, the
          # browser visiting http://localhost:3000 rejects a cookie for a domain
          # it is not under, and every sign-in ends in `/api/permissions -> 401`.
          # Measured on 2026-08-26 — one run spent forty minutes retrying before
          # the cause was found, and the same probe passes in 6 seconds without
          # it.
        run: bun run build

      # Backgrounded with a readiness poll rather than a fixed sleep: the first
      # request is what decides whether the run is testing an app or an empty
      # port, and `next start` is ready in seconds or not at all.
      - name: Start the built server
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          WORKOS_API_KEY: ${{ secrets.WORKOS_API_KEY }}
          WORKOS_CLIENT_ID: ${{ secrets.WORKOS_CLIENT_ID }}
          WORKOS_COOKIE_PASSWORD: ${{ secrets.WORKOS_COOKIE_PASSWORD }}
          NEXT_PUBLIC_WORKOS_REDIRECT_URI: http://localhost:3000/auth/callback
          NEXT_PUBLIC_APP_DOMAIN: yipyy.test
          # ── PLACEHOLDERS, AND THEY MUST STAY PLACEHOLDERS ─────────────────
          #
          # `cloverConfig()` returns null when APP_ID or APP_SECRET is absent,
          # and /clover then renders "Yipyy Pay is not available here" instead
          # of the launch cards. `clover-connect.spec.ts` asserts those cards,
          # so without these two it failed every night from the day it was
          # added (2026-08-27) to 2026-08-31 — five consecutive nightlies,
          # never once green. Its third test passed throughout, because it
          # asserts only that something is ABSENT, which an error card
          # satisfies. A spec can be red for a week without anybody reading it.
          #
          # Fake values are CORRECT here, not a shortcut. Every case in that
          # file stops before Clover is contacted — signed out, or signed in
          # administering nothing — so the credentials are never sent anywhere;
          # only their PRESENCE is read. The specs that do reach Clover need a
          # production identity and a deployed environment, cannot run in this
          # job at all, and live in `clover.yml`.
          #
          # So do not replace these with real secrets to "make it more
          # realistic": that would put live payment credentials on a public
          # repository's runner to no test's benefit.
          CLOVER_APP_ID: e2e-placeholder-app-id
          CLOVER_APP_SECRET: e2e-placeholder-app-secret
        run: |
          bun run start --port 3000 > /tmp/server.log 2>&1 &
          for i in $(seq 1 60); do
            if [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/sign-in)" = "200" ]; then
              echo "Server up after ${i}s."
              exit 0
            fi
            sleep 1
          done
          echo "::error::The server never became ready. Last 50 lines:"
          tail -50 /tmp/server.log
          exit 1

      - name: Run the auth, access & operations specs
        env:
          E2E_BASE_URL: http://localhost:3000
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
          # The RUNNER needs this too, not just the build and the server.
          # `tls-ask.spec.ts` asks the certificate gate about `<host>.<apex>`,
          # and the gate compares against the apex the APP was built with — so
          # the harness has to be told the same value or it asserts against a
          # different domain than the server is answering for.
          NEXT_PUBLIC_APP_DOMAIN: yipyy.test
          WORKOS_API_KEY: ${{ secrets.WORKOS_API_KEY }}
          WORKOS_CLIENT_ID: ${{ secrets.WORKOS_CLIENT_ID }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        # ── ONE JOB, TWO SUITES, CHOSEN BY WHAT TRIGGERED IT ──────────────
        #
        # A push or a PR runs the 12-spec gate: the authorisation boundary and
        # money, the two things worth blocking a push over, in minutes rather
        # than three quarters of an hour.
        #
        # The nightly schedule and a manual workflow_dispatch run all 59. The
        # coverage is not dropped, it is rescheduled — and `bun run test:e2e:ci`
        # is still the command to run by hand before anything that matters.
        #
        # A second job would have meant duplicating ~100 lines of preflight,
        # server build and purge, and the two would have drifted.
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Full suite (59 specs)."
            bun run test:e2e:ci
          else
            echo "Gate (12 specs: access & money). The full suite runs nightly."
            bun run test:e2e:gate
          fi

      # ── THE SUITE TAKES ITS BOOKINGS BACK OUT ───────────────────────────
      #
      # There is one Postgres. The specs clean up by CANCELLING, which keeps the
      # boards honest but not the table: measured before this step existed,
      # `bookings` held 477 rows and 434 were e2e leftovers, against 43 the
      # facility had made itself. The operations cluster leaves ~35 a run.
      #
      # `always()`, because a failed run is the one that leaves the most behind.
      # It deletes only cancelled, money-free rows matching `%[e2e %` — see
      # scripts/purge-e2e-bookings.ts — so a booking that took a payment keeps
      # its row and the append-only ledger still points at something.
      #
      # `continue-on-error` so a purge that cannot connect never turns a green
      # test run red. The cleanup is important; it is not the assertion.
      - name: Purge the bookings the suite created
        if: always()
        continue-on-error: true
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: bun run e2e:purge

      # `|| echo` because the commonest failure is the preflight, which runs
      # before any server exists — and `tail` on a missing file adds a second
      # red ##[error] under the one that actually explains what to do.
      - name: Server log (on failure)
        if: failure()
        run: |
          tail -200 /tmp/server.log 2>/dev/null             || echo "(no server log — the run failed before the server started)"

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          # Same reason: a preflight failure produces no report, and the default
          # is to warn about that on top of the real error.
          if-no-files-found: ignore

  # ── THE IMAGE ─────────────────────────────────────────────────────────────
  #
  # The production artifact. Built here and never on the server: `next build`
  # once SIGKILLed an 8 GB Vercel builder on this repo, and the VPS has 7.8 GB.
  # A GitHub runner has 16 GB and four cores, so this is both safer and faster —
  # and it makes a deploy a pull rather than a compile, which is what lets a
  # rollback be a re-tag.
  #
  # Gated on every quality job, which is the point of the whole exercise: Vercel
  # deploys on push and reports afterwards, so its required checks were a
  # post-mortem. Here nothing is built until they pass.
  image:
    name: image (build & push to GHCR)
    runs-on: ubuntu-latest
    needs: [typecheck, lint, format, unit, checks, sql, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          # The action lowercases this. GHCR rejects `Yipyy-Inc`, so the raw
          # `${{ github.repository }}` would 400 on the push.
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          # PINNED. ubuntu-latest is amd64 today, but an arm runner would
          # silently produce an image carrying an arm64 sharp that this VPS
          # cannot execute — and it would fail at the first receipt render.
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # ── PUBLIC VALUES ONLY ────────────────────────────────────────────
          #
          # These are inlined into the client bundle by `next build`, so they
          # are already public by definition and their appearance in
          # `docker history` discloses nothing. The two domain values are
          # written literally rather than stored as secrets because masking
          # `https://yipyy.com` turns every log line mentioning the site into
          # `***`, and because they must match what WorkOS has registered.
          #
          # NOTHING else belongs here. SUPABASE_SERVICE_ROLE_KEY, WORKOS_API_KEY,
          # the CLOVER_* secrets and CRON_SECRET are runtime-only and live in a
          # root-owned .env on the box — a layer keeps what you put in it even
          # after you delete it.
          #
          # NEXT_PUBLIC_REALTIME_URL is empty on purpose: that is what selects
          # the BroadcastChannel transport, and no WebSocket server exists.
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
            NEXT_PUBLIC_APP_URL=https://yipyy.com
            NEXT_PUBLIC_APP_DOMAIN=yipyy.com
            NEXT_PUBLIC_WORKOS_REDIRECT_URI=https://yipyy.com/auth/callback
            NEXT_PUBLIC_REALTIME_URL=

  # ── THE DEPLOY ────────────────────────────────────────────────────────────
  #
  # DARK until `vars.DEPLOY_ENABLED` is set to "true" in the repository
  # settings. That switch is the cutover: until it is flipped the image is built
  # and stored but nothing is shipped, so this job can sit on `main` through the
  # whole parallel run without touching anything.
  deploy:
    name: deploy (VPS)
    runs-on: ubuntu-latest
    needs: image
    if: vars.DEPLOY_ENABLED == 'true'
    # Queued, never cancelled, never parallel. Two deploys racing each other
    # over one compose project is how a box ends up running an image nobody
    # chose.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    steps:
      # ── THE BOX HOLDS NO REGISTRY CREDENTIAL ────────────────────────────
      #
      # GITHUB_TOKEN is minted for this run and expires with it, so the login
      # is ephemeral and there is no PAT on disk to leak or to rotate. The
      # logout at the end runs even if the deploy fails, because leaving a
      # registry credential in root's docker config is exactly the kind of
      # thing nobody notices until it is old.
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          SMOKE_HOST: ${{ vars.SMOKE_HOST || 'yipyy.com' }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          # ── TWO TIMEOUTS, AND THEY MEASURE DIFFERENT THINGS ──────────────
          #
          # `command_timeout` bounds the deploy script once it is running.
          # `timeout` bounds getting there — the TCP connect and handshake —
          # and defaults to 30s, which is exactly what expired on 2026-09-01:
          # `dial tcp ***:22: i/o timeout` at duration_ms=30193, before a byte
          # of the script ran. The box was idle at load 0.00 throughout and
          # answered SSH from elsewhere in the same minute, so the reach is the
          # runner's, not the server's — the same shape measured on 2026-08-25,
          # when an Azure eastus2 runner could not reach this host at all while
          # westus could.
          #
          # 60s does not fix an unroutable runner. It absorbs the marginal case
          # and leaves the genuinely unreachable one still failing, which is
          # what should happen: a deploy that stops cleanly and leaves the old
          # colour serving is the correct outcome, and re-running the job is
          # the documented remedy.
          timeout: 60s
          command_timeout: 15m
          envs: GHCR_TOKEN,GHCR_USER,SMOKE_HOST
          script: |
            # `set -e` is the only thing stopping this script on a failed step.
            # This step also passed `script_stop: true` until 2026-09-01 — a
            # v0.x input v1 does not accept — so every deploy log opened with
            # `Warning: Unexpected input(s) 'script_stop'` while the setting did
            # nothing. "Install and verify the messaging timer", below, has said
            # so in a comment since it was written; the knowledge just never
            # came back up here. Do not delete this line thinking the action
            # covers it.
            set -e
            trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            # ${{ github.sha }}, NOT the metadata-action `version` output.
            # That output resolved to `latest` on the first real deploy, so the
            # box recorded IMAGE_TAG_BLUE=latest and stopped knowing which
            # commit it was running — which quietly breaks the whole rollback
            # story, since `deploy.sh <previous-sha>` needs a sha to go back to
            # and `latest` is a moving target. The image is tagged
            # `type=sha,format=long,prefix=`, so the full sha is always there.
            SMOKE_HOST="$SMOKE_HOST" /opt/yipyy/deploy.sh ${{ github.sha }}

      # From the public internet, not from inside the box — the deploy script
      # already checked it from in there, and that cannot see a broken
      # certificate, a firewall rule or a DNS record.
      - name: Verify from outside
        run: |
          for i in $(seq 1 12); do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 https://yipyy.com/api/health || true)
            if [ "$code" = 200 ]; then echo "public health OK"; exit 0; fi
            sleep 5
          done
          echo "::error::Public /api/health never answered 200 after the deploy."
          echo "Roll back: ssh deploy@<host> /opt/yipyy/deploy.sh <previous-sha>"
          exit 1

      # ── THE TIMERS THE APP CANNOT START FOR ITSELF ──────────────────────
      #
      # `messaging-tick` drains the outbox: every message a rule deferred sits
      # in `message_sends` as `queued` until something calls that route. If the
      # timer is not on the box, those rows sit there for ever WHILE THE
      # AUTOMATIONS SCREEN COUNTS THEM AS SENT — a facility believing it wrote
      # to a customer who never heard from it.
      #
      # `clover-sweep.timer` was installed by hand and stayed installed, which
      # worked precisely once and is not a process. This step is here so the
      # unit is a property of the deploy rather than of somebody's memory.
      #
      # AFTER the health check on purpose. The application is already live and
      # verified by this point, so a broken unit file turns the run red — which
      # is what should happen — without ever standing between a deploy and
      # production.
      # The deploy job does NOT check out the repository — SSHing to a box does
      # not need one, and it had none until these steps arrived. Without this,
      # scp finds nothing and fails with `tar: Cowardly refusing to create an
      # empty archive`, which does not obviously mean "there is no checkout".
      #
      # Sparse, because the only thing wanted here is deploy/, and a full
      # checkout on the deploy runner is a minute of nothing.
      - name: Check out the unit files
        uses: actions/checkout@v4
        with:
          sparse-checkout: deploy

      - name: Copy the timer units
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "deploy/messaging-tick.sh,deploy/messaging-tick.service,deploy/messaging-tick.timer"
          target: /tmp/yipyy-units
          strip_components: 1

      - name: Install and verify the messaging timer
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          # Same 60s connect timeout as the deploy step, for the same reason:
          # the default is 30s and this reaches the same host over the same
          # path, so it is exposed to the same runner-side unreachability.
          timeout: 60s
          # No `script_stop`: this action does not accept it (it warns and
          # ignores). `set -e` below is what actually stops on the first
          # failure.
          script: |
            set -e
            install -m 0755 /tmp/yipyy-units/messaging-tick.sh /usr/local/bin/messaging-tick
            install -m 0644 /tmp/yipyy-units/messaging-tick.service /etc/systemd/system/
            install -m 0644 /tmp/yipyy-units/messaging-tick.timer   /etc/systemd/system/
            rm -rf /tmp/yipyy-units

            # The script reads CRON_SECRET and SWEEP_HOST from here, the same
            # file the Clover sweep already uses. Without it the tick answers
            # 503 for ever and nothing says why, so fail loudly instead.
            test -r /etc/yipyy/cron.env || {
              echo "::error::/etc/yipyy/cron.env is missing; the tick cannot authenticate."
              exit 1
            }

            systemctl daemon-reload
            systemctl enable --now messaging-tick.timer

            # `enable` succeeding is not the same as the timer being armed.
            systemctl is-active --quiet messaging-tick.timer || {
              echo "::error::messaging-tick.timer is installed but not active."
              systemctl status messaging-tick.timer --no-pager || true
              exit 1
            }
            systemctl list-timers messaging-tick.timer --no-pager
