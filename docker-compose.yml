# ============================================================================
# Yipyy — what runs on the VPS.
#
# Two app containers and one Caddy. The apps never bind a host port: the ONLY
# way in is through Caddy on 80/443. That matters more than it looks — Docker
# publishes ports by writing iptables rules directly, bypassing ufw entirely, so
# a published app port would be reachable from the internet whatever the
# firewall says.
#
# ── WHY TWO COLOURS ────────────────────────────────────────────────────────
#
# With one container, `docker compose up -d` STOPS the old one before starting
# the new. `stop_grace_period` is 200s so a card-present payment in flight can
# finish — which means the site can be down for the whole of that window. That
# is not a deploy strategy for a platform taking card payments.
#
# So deploys start the IDLE colour, wait for it to be healthy, prove it with a
# real request, and then point Caddy at it with `caddy reload`. The reload is
# graceful: in-flight requests finish on the old config. Nobody is interrupted,
# including somebody 90 seconds into tapping a card.
#
# The previous colour is LEFT RUNNING. ~600 MB of idle memory buys a rollback
# that is one reload and under a second — the only rollback speed that matters
# when the thing being rolled back moves money.
#
# Both colours carry the network alias `app`, so the on-demand-TLS `ask`
# endpoint in the Caddyfile has a stable address that never needs rewriting.
# ============================================================================

name: yipyy

x-app: &app
  restart: unless-stopped

  # Runtime secrets live in a root-owned .env beside this file — never in the
  # image, never in GitHub Actions. The six NEXT_PUBLIC_* values are NOT here:
  # they were inlined at build time and setting them now does nothing at all.
  #
  # WORKOS_COOKIE_DOMAIN must be `.yipyy.com` WITH the leading dot once the apex
  # is served here, or a session does not span facility subdomains and signing
  # in appears to succeed then bounces back to the login page.
  env_file:
    - .env

  environment:
    NODE_ENV: production
    PORT: "3000"
    HOSTNAME: "0.0.0.0"
    # The box has 7.8 GB, its swap is insurance rather than headroom, and BOTH
    # colours are resident during a swap. An uncapped Node heap gets the
    # container OOM-killed with no log line anywhere; a capped one collects
    # garbage instead.
    NODE_OPTIONS: "--max-old-space-size=1800"
    # facility_takings does its own timezone bucketing. A box-local timezone
    # would silently reinterpret it.
    TZ: UTC

  # PID 1 in a container neither reaps children nor forwards signals the way an
  # init does. Without this, SIGTERM never reaches Node and every stop waits out
  # the full grace period.
  init: true

  # Longer than the 150 seconds src/lib/clover/terminal.ts will wait for a human
  # to tap a card. Retiring a colour must not sever a payment.
  stop_grace_period: 200s

  mem_limit: 2600m

  # Deliberately no `ports:`. See the header.
  expose:
    - "3000"

  # receipt-image.ts sets XDG_CACHE_HOME=/tmp before loading sharp, so
  # fontconfig writes its cache here. tmpfs keeps it off disk and writable by
  # the unprivileged uid the image runs as.
  tmpfs:
    - /tmp:size=256m,mode=1777,uid=10001,gid=10001

  volumes:
    # next/image now transcodes on 2 vCPU rather than at Vercel's edge. Without
    # this the cache is empty after every deploy and the first page load
    # re-optimises every Supabase-hosted facility logo. Shared between colours:
    # Next writes content-hashed paths, so two readers and writers are safe.
    - next_image_cache:/app/.next/cache

  networks:
    edge:
      aliases:
        - app

  healthcheck:
    test:
      [
        "CMD",
        "node",
        "-e",
        "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
      ]
    interval: 15s
    timeout: 5s
    start_period: 45s
    retries: 4

  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

services:
  app_blue:
    <<: *app
    profiles: ["blue"]
    container_name: yipyy-app-blue
    image: ghcr.io/yipyy-inc/puneet:${IMAGE_TAG_BLUE:-latest}

  app_green:
    <<: *app
    profiles: ["green"]
    container_name: yipyy-app-green
    image: ghcr.io/yipyy-inc/puneet:${IMAGE_TAG_GREEN:-latest}

  caddy:
    image: caddy:2-alpine
    container_name: yipyy-caddy
    restart: unless-stopped
    init: true

    ports:
      - "80:80"
      - "443:443"
      # HTTP/3. Harmless if unused; browsers increasingly use it.
      - "443:443/udp"

    volumes:
      # ── THE DIRECTORY, NOT THE FILES ────────────────────────────────────
      #
      # Docker bind-mounts a single FILE by inode, so anything that REPLACES it
      # rather than writing in place — scp, `sed -i`, most editors' save — leaves
      # the container reading the old inode while the new content sits on disk.
      # The symptom is a config error naming a line you have already deleted.
      # Mounting the directory makes the file swap invisible, which is exactly
      # what deploy.sh needs when it rewrites upstream.caddy.
      - ./caddy:/etc/caddy:ro
      # ── DO NOT LOSE THIS ────────────────────────────────────────────────
      # Every issued certificate AND the ACME account key. Recreate this volume
      # and every host re-issues at once, against a limit of 50 certificates per
      # registered domain per week. It is the only stateful thing on an
      # otherwise stateless box, so it is the one thing worth snapshotting.
      - caddy_data:/data
      - caddy_config:/config

    environment:
      # Which hostnames get a certificate AT STARTUP rather than on demand.
      # During the parallel run this is `staging.yipyy.com`, because naming a
      # host whose DNS still points at Vercel makes Caddy fail HTTP-01 in a
      # retry loop against a 5-failures-per-hour limit. It becomes
      # `yipyy.com, www.yipyy.com` once the apex actually resolves here.
      PRIMARY_HOSTS: ${PRIMARY_HOSTS:-yipyy.com, www.yipyy.com}
      TZ: UTC

    networks:
      - edge

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  caddy_data:
  caddy_config:
  next_image_cache:

networks:
  edge:
    driver: bridge
    # NOT `internal`: the app needs egress to Supabase, WorkOS, Clover, Resend,
    # Twilio and Anthropic, and Caddy needs it for ACME.
