    <script>
      document.addEventListener("DOMContentLoaded", async function () {
        const loading = document.getElementById("__bundler_loading");
        function setStatus(msg) {
          if (loading) loading.textContent = msg;
        }

        const FONT_MIME =
          /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
        const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
        function toBase64(bytes) {
          let bin = "";
          for (let i = 0; i < bytes.length; i += 0x8000) {
            bin += String.fromCharCode.apply(
              null,
              bytes.subarray(i, i + 0x8000),
            );
          }
          return btoa(bin);
        }

        // Error sink persists across replaceWith since it's on window, not the DOM.
        window.addEventListener(
          "error",
          function (e) {
            // Failed resource loads (CSP-blocked links, scripts, images) fire plain
            // events at the element — warn only; real JS errors carry message/error.
            if (!e.message && !e.error && e.target && e.target !== window) {
              console.warn(
                "[bundle] resource failed to load:",
                e.target.tagName,
                String(e.target.src || e.target.href || ""),
              );
              return;
            }
            var p = document.body || document.documentElement;
            var d =
              document.getElementById("__bundler_err") ||
              p.appendChild(document.createElement("div"));
            d.id = "__bundler_err";
            d.style.cssText =
              "position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto";
            d.textContent =
              (d.textContent ? d.textContent + String.fromCharCode(10) : "") +
              "[bundle] " +
              (e.message || e.type) +
              (e.filename
                ? " (" + e.filename.slice(0, 60) + ":" + e.lineno + ")"
                : "");
          },
          true,
        );

        try {
          const manifestEl = document.querySelector(
            'script[type="__bundler/manifest"]',
          );
          const templateEl = document.querySelector(
            'script[type="__bundler/template"]',
          );
          if (!manifestEl || !templateEl) {
            setStatus("Error: missing bundle data");
            console.error(
              "[bundler] Missing script tags — manifestEl:",
              !!manifestEl,
              "templateEl:",
              !!templateEl,
            );
            return;
          }

          const manifest = JSON.parse(manifestEl.textContent);
          let template = JSON.parse(templateEl.textContent);

          // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
          // document's manifest; frame srcs carry an about:blank#<uuid> marker
          // instead of a substitutable uuid. Every document mints the blobs for
          // its OWN frames — from local text at the root, or text obtained from
          // its DIRECT parent over the relay protocol below — so each frame
          // navigation stays same-origin with its initiator and a deduped page
          // loads at any depth on any host, including a file:// download's
          // opaque origins (where a blob minted by one document cannot be
          // navigated to by another).
          const pageOrderEl = document.querySelector(
            'script[type="__bundler/page_order"]',
          );
          const pageOrder = pageOrderEl
            ? JSON.parse(pageOrderEl.textContent)
            : [];
          const pageSet = new Set(pageOrder);
          const pageTexts = {};

          // ── Nested-page text protocol (parent-chain relay) ──
          // Page bundles ship once, in the ROOT document's manifest. Every
          // document mints the blobs for its OWN frames, obtaining page text
          // through a strict parent-chain relay: a document only ever SENDS to
          // its direct parent (which, for every document the publisher's own
          // runtime minted, is another publisher document) and only ACCEPTS
          // text from that direct parent; requests from below are honored only
          // for the document's own child frames, and the ROOT never sends
          // upward at all. That last rule is load-bearing: the artifact host's
          // frame-ancestors allows claude.ai (and friends) to frame an
          // artifact, so window.top can be a FOREIGN document — a top-addressed
          // protocol would hand page uuids to that ancestor and accept forged
          // "page text" from it, minting attacker HTML as an artifact-origin
          // blob document. The chain never touches the ancestor: requests stop
          // at the root, replies are origin-addressed per hop (never '*' when
          // an origin exists), and both directions are origin-gated (on https
          // a foreign sender's origin can never equal this document's; in
          // opaque contexts — file:// — everything serializes as 'null', where
          // an embedded EXTERNAL frame still fails the gate by carrying its
          // own real origin, and a sandboxed child of such a frame is excluded
          // by the own-child-frames check plus uuid unguessability). Shape is
          // deny-by-default: one request form, one reply form, no error
          // replies.
          // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
          // contexts such as a sandboxed preview iframe) — location.origin is
          // computed from the URL and stays 'https://…' even when the document
          // is sandboxed, which would misgate every opaque chain.
          const OWN_TARGET = /^https?:[/][/]/.test(window.origin || "")
            ? window.origin
            : "*";
          function trustedOrigin(e) {
            if (e.origin === window.origin) return true; // https chains; opaque==opaque
            // file:// trees: Chrome serializes the file document's origin as
            // 'file://' while the blob: documents it mints serialize as 'null',
            // so the two legitimate shapes can never string-match — accept the
            // pair in both directions. https origins never serialize as either,
            // and sender identity (own child frame / direct parent) is checked
            // separately.
            return (
              (e.origin === "null" &&
                (window.origin === "file://" ||
                  window.location.protocol === "file:")) ||
              (/^file:/.test(e.origin) && window.origin === "null")
            );
          }
          // Non-empty only in the root document (nested bundles ship an empty
          // island), so it doubles as the root marker: the root answers from
          // local text and treats a miss as authoritative — never relaying to
          // its (possibly foreign) parent.
          const isPageRoot = pageOrder.length > 0;
          const blobUrls = {};
          const resourceBlobs = {};
          const UUID_SHAPE =
            /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
          const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
          const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
          function mountPage(el, frag, text) {
            const pageBlob = new Blob([text], { type: "text/html" });
            const u = URL.createObjectURL(pageBlob);
            resourceBlobs[u] = pageBlob;
            el.src = u + frag;
          }
          function deliverPage(uuid, text) {
            const frames = pendingFrames[uuid];
            delete pendingFrames[uuid];
            if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
            const relays = pendingRelays[uuid];
            delete pendingRelays[uuid];
            if (relays) {
              for (const cw of relays) {
                try {
                  cw.postMessage(
                    { __bundler_page: uuid, __bundler_text: text },
                    OWN_TARGET,
                  );
                } catch (err) {
                  /* gone */
                }
              }
            }
          }
          function ownFrameWindows() {
            const out = [];
            for (const f of Array.from(document.querySelectorAll("iframe"))) {
              try {
                if (f.contentWindow) out.push(f.contentWindow);
              } catch (err) {
                /* detached */
              }
            }
            return out;
          }
          window.addEventListener("message", function (e) {
            const d = e.data;
            if (!d || typeof d !== "object" || !e.source) return;
            // Origin gate first; the structural checks below (own-child-frames
            // for requests, direct-parent + solicited-uuid for replies, the
            // root's never-relay rule) are what hold in fully opaque chains
            // where origin strings can't discriminate — a sandboxed root's
            // FOREIGN wrapper still fails all three even though both serialize
            // as real-vs-'null' rather than matching.
            if (!trustedOrigin(e)) return;
            if (
              typeof d.__bundler_need === "string" &&
              UUID_SHAPE.test(d.__bundler_need)
            ) {
              // Requests are honored only for this document's own child frames.
              if (ownFrameWindows().indexOf(e.source) < 0) return;
              const uuid = d.__bundler_need;
              const text = pageTexts[uuid];
              if (typeof text === "string") {
                try {
                  e.source.postMessage(
                    { __bundler_page: uuid, __bundler_text: text },
                    OWN_TARGET,
                  );
                } catch (err) {
                  /* gone */
                }
                return;
              }
              if (isPageRoot || window.parent === window) return; // authoritative miss
              const waiting = pendingRelays[uuid];
              if (waiting) {
                if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
                return;
              }
              // Never-answered uuids would otherwise accumulate forever under a
              // request spray; past the cap (far above any real page count) new
              // relays are dropped rather than remembered.
              if (Object.keys(pendingRelays).length >= 128) return;
              pendingRelays[uuid] = [e.source];
              window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
            } else if (
              typeof d.__bundler_page === "string" &&
              UUID_SHAPE.test(d.__bundler_page) &&
              typeof d.__bundler_text === "string"
            ) {
              // The shape test is load-bearing beyond tidiness: the solicited
              // check below uses the in operator, which matches prototype keys
              // ('__proto__', 'constructor') — an unshaped key would reach
              // deliverPage and throw, painting the error banner.
              // Text is accepted only from the direct parent — the document
              // that minted this one.
              if (e.source !== window.parent || window.parent === window)
                return;
              if (
                !(d.__bundler_page in pendingFrames) &&
                !(d.__bundler_page in pendingRelays)
              )
                return;
              deliverPage(d.__bundler_page, d.__bundler_text);
            }
          });

          const uuids = Object.keys(manifest);
          setStatus("Unpacking " + uuids.length + " assets...");

          await Promise.all(
            uuids.map(async (uuid) => {
              const entry = manifest[uuid];
              try {
                const binaryStr = atob(entry.data);
                const bytes = new Uint8Array(binaryStr.length);
                for (let i = 0; i < binaryStr.length; i++)
                  bytes[i] = binaryStr.charCodeAt(i);

                let finalBytes = bytes;
                if (entry.compressed) {
                  if (typeof DecompressionStream !== "undefined") {
                    const ds = new DecompressionStream("gzip");
                    const writer = ds.writable.getWriter();
                    const reader = ds.readable.getReader();
                    writer.write(bytes);
                    writer.close();
                    const chunks = [];
                    let totalLen = 0;
                    while (true) {
                      const { done, value } = await reader.read();
                      if (done) break;
                      chunks.push(value);
                      totalLen += value.length;
                    }
                    finalBytes = new Uint8Array(totalLen);
                    let offset = 0;
                    for (const chunk of chunks) {
                      finalBytes.set(chunk, offset);
                      offset += chunk.length;
                    }
                  } else {
                    console.warn(
                      "DecompressionStream not available, asset " +
                        uuid +
                        " may not render",
                    );
                  }
                }

                if (pageSet.has(uuid)) {
                  pageTexts[uuid] = new TextDecoder().decode(finalBytes);
                  return;
                }
                if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
                  // Strict artifact hosts allow font-src data: but not blob:.
                  blobUrls[uuid] =
                    "data:" +
                    entry.mime +
                    ";base64," +
                    (entry.compressed ? toBase64(finalBytes) : entry.data);
                } else {
                  const blob = new Blob([finalBytes], { type: entry.mime });
                  blobUrls[uuid] = URL.createObjectURL(blob);
                  resourceBlobs[blobUrls[uuid]] = blob;
                }
              } catch (err) {
                console.error("Failed to decode asset " + uuid + ":", err);
                const blob = new Blob([], { type: entry.mime });
                blobUrls[uuid] = URL.createObjectURL(blob);
                resourceBlobs[blobUrls[uuid]] = blob;
              }
            }),
          );

          const extResEl = document.querySelector(
            'script[type="__bundler/ext_resources"]',
          );
          const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
          const resourceMap = {};
          for (const entry of extResources) {
            if (blobUrls[entry.uuid])
              resourceMap[entry.id] = blobUrls[entry.uuid];
          }

          // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
          // consumers read these Blobs directly. Survives the swap like the error sink.
          window.__resourceBlobs = resourceBlobs;

          setStatus("Rendering...");
          // Page uuids have no blob here — they ride inside about:blank#<uuid>
          // frame markers the pass below resolves after the swap.
          for (const uuid of uuids) {
            if (pageSet.has(uuid)) continue;
            template = template.split(uuid).join(blobUrls[uuid]);
          }

          // Strip integrity + crossorigin — blob URLs from a file:// document inherit
          // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
          // The manifest bytes are ours; SRI protects against CDN compromise, not this.
          template = template
            .replace(/\s+integrity="[^"]*"/gi, "")
            .replace(/\s+crossorigin="[^"]*"/gi, "");

          const resourceScript =
            "<script>window.__resources = " +
            JSON.stringify(resourceMap).replace(/<\//g, "<\\/") +
            ";</" +
            "script>";
          // Inject after <head> so the DOCTYPE stays first; prepending the script
          // would push the parser into quirks mode. DOMParser always emits a <head>
          // (synthesizing one if the source HTML omitted it) but may carry
          // attributes through, so match the full opening tag. slice() rather than
          // replace() keeps us clear of $-pattern substitution in resourceScript.
          const headOpen = template.match(/<head[^>]*>/i);
          if (headOpen) {
            const i = headOpen.index + headOpen[0].length;
            template =
              template.slice(0, i) + resourceScript + template.slice(i);
          }

          // Parse the template and swap the root element. Scripts inserted via
          // DOMParser/replaceWith are inert per spec — re-create each with
          // createElement so they execute, awaiting onload for src scripts to
          // preserve ordering (React before ReactDOM before Babel before text/babel).
          const doc = new DOMParser().parseFromString(template, "text/html");
          document.documentElement.replaceWith(doc.documentElement);

          // Resolve page-frame markers: mint this document's own blob for each
          // framed page — from local text when this is the root, otherwise by
          // asking the direct parent over the relay protocol above. An
          // unanswered request leaves the frame on about:blank, the same
          // degraded state as a refused embed.
          {
            const MARKER =
              /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
            const needed = [];
            for (const el of Array.from(document.querySelectorAll("iframe"))) {
              const m = MARKER.exec(el.getAttribute("src") || "");
              if (!m) continue;
              const text = pageTexts[m[1]];
              if (typeof text === "string") {
                mountPage(el, m[2] || "", text);
              } else if (window.parent !== window && !isPageRoot) {
                const had = pendingFrames[m[1]];
                (pendingFrames[m[1]] = had || []).push({
                  el: el,
                  frag: m[2] || "",
                });
                if (!had) needed.push(m[1]);
              }
            }
            for (const uuid of needed) {
              window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
            }
          }

          const dead = Array.from(document.scripts);
          for (const old of dead) {
            const s = document.createElement("script");
            for (const a of old.attributes) s.setAttribute(a.name, a.value);
            s.textContent = old.textContent;
            // text/babel scripts with a src: read and inline. transformScriptTags
            // does XHR against the src, but blob:null/ from a file:// origin is
            // silently dropped. Inlining makes it a plain inline babel script,
            // which transformScriptTags handles unconditionally.
            if ((s.type === "text/babel" || s.type === "text/jsx") && s.src) {
              const pre = resourceBlobs[s.src.split("#")[0]];
              s.textContent = pre
                ? await pre.text()
                : await (await fetch(s.src)).text();
              s.removeAttribute("src");
            }
            const p = s.src
              ? new Promise(function (r) {
                  s.onload = s.onerror = r;
                })
              : null;
            old.replaceWith(s);
            if (p) await p;
          }
          // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
          // which fired before we swapped the document. Trigger manually if present.
          if (
            window.Babel &&
            typeof window.Babel.transformScriptTags === "function"
          ) {
            window.Babel.transformScriptTags();
          }
        } catch (err) {
          setStatus("Error unpacking: " + err.message);
          console.error("Bundle unpack error:", err);
        }
      });
    </script>

ontent:center;font-family:'JetBrains Mono',monospace;font-size:11px;color:#9A9890;position:relative\">room photo · set by facility\n                    <span style=\"position:absolute;top:12px;left:12px;padding:5px 10px;border-radius:999px;background:#1F2633;color:#fff;font-family:'Plus Jakarta Sans',sans-serif;font-size:12.5px;font-weight:600\">{{ r.priceTag }}<\u002Fspan>\n                  <\u002Fdiv>\n                  <div style=\"padding:16px 18px;display:flex;flex-direction:column;gap:8px\">\n                    <div style=\"display:flex;justify-content:space-between;gap:8px;align-items:baseline\"><span style=\"font-size:16.5px;font-weight:600\">{{ r.name }}<\u002Fspan><span style=\"font-size:12.5px;font-weight:600;color:{{ r.freeColor }};white-space:nowrap\">{{ r.freeText }}<\u002Fspan><\u002Fdiv>\n                    <div style=\"font-size:13px;color:#6B7280\">{{ r.size }}<\u002Fdiv>\n                    <div style=\"display:flex;gap:6px;flex-wrap:wrap\">\n                      <sc-for list=\"{{ r.feat }}\" as=\"f\"><span style=\"padding:3px 9px;border-radius:999px;background:#F4F3EF;font-size:12px;color:#4B5563\">{{ f }}<\u002Fspan><\u002Fsc-for>\n                    <\u002Fdiv>\n                    <sc-if value=\"{{ r.hasReason }}\"><div style=\"font-size:12.5px;font-weight:600;color:#B4561F\">{{ r.reason }}<\u002Fdiv><\u002Fsc-if>\n                  <\u002Fdiv>\n                  <div style=\"position:absolute;top:12px;right:12px;width:26px;height:26px;border-radius:50%;background:{{ acc }};color:{{ accText }};display:{{ r.ck }};align-items:center;justify-content:center;font-size:13px;font-weight:700\">✓<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <sc-if value=\"{{ isFac }}\"><div style=\"font-size:12.5px;color:#6B7280\">Room photos, descriptions and size limits come from Settings → Boarding → Room types.<\u002Fdiv><\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <!-- A align-items:center;justify-content:center\">{{ q.initial }}<\u002Fspan>\n                        <span style=\"font-size:13px;font-weight:500;padding-right:4px\">{{ q.pet }}<\u002Fspan>\n                        <button sc-camel-on-click=\"{{ q.dec }}\" style=\"width:{{ stepBtn }};height:{{ stepBtn }};border-radius:50%;border:1px solid #E3E1DB;background:#fff;cursor:pointer;font-size:15px;opacity:{{ q.decOp }};color:#1B2333\">−<\u002Fbutton>\n                        <span style=\"min-width:16px;text-align:center;font-size:14px;font-weight:600;color:{{ q.qColor }}\">{{ q.qty }}<\u002Fspan>\n                        <button sc-camel-on-click=\"{{ q.inc }}\" style=\"width:{{ stepBtn }};height:{{ stepBtn }};border-radius:50%;border:1px solid #E3E1DB;background:#fff;cursor:pointer;font-size:15px;opacity:{{ q.incOp }};color:#1B2333\">+<\u002Fbutton>\n                      <\u002Fdiv>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <!-- FEEDING (existing module) -->\n        <sc-if value=\"{{ scrFeeding }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:flex;flex-direction:column;gap:16px;max-width:900px\">\n            <div style=\"display:flex;flex-direction:column;gap:3px\">\n              <div style=\"font-size:17px;font-weight:600\">Feeding schedule<\u002Fdiv>\n              <div style=\"font-size:13.5px;color:#6B7280\">Optional — leave blank if the pet won’t be fed during this visit.<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"border:1.5px dashed #D9D6CF;border-radius:22px;padding:22px 24px;display:flex;flex-direction:column;gap:12px;background:#fff\">\n              <div style=\"font-family:'JetBrains Mono',monospace;font-size:11.5px;color:#8C8A83;letter-spacing:.04em\">EXISTING FEEDING MODULE · DROPS IN HERE AS-IS<\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:9px;font-size:14px;line-height:1.5;color:#374151\">\n                <div>• Banner from service settings: “Feeding is included with boarding — no extra charge”.<\u002Fdiv>\n                <div>• Meal presets to tap and add: AM 9:00 AM, Noon 12:00 PM, PM 6:00 PM — each meal gets food, portion and who provides it.<\u002Fdiv>\n                <div>• Empty state: “No meals added yet — tap a preset above to get started”.<\u002Fdiv>\n                <div>• Feeding instruction chips: Feed alone, Free feed, Hand feed, Slow feeder, + Other.<\u002Fdiv>\n                <div>• Allergies / restrictions chips: Chicken, Beef, Grain-free, Sensitive stomach, Dairy, + Other (pre-filled from the pet profile).<\u002Fdiv>\n                <div>• Additional notes field — e.g. picky eater, needs kibble soaked in warm water.<\u002Fdiv>\n                <div>• With multiple pets: one feeding plan per pet.<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <!-- MEDICATION (existing module) -->\n        <sc-if value=\"{{ scrMeds }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:flex;flex-direction:column;gap:16px;max-width:900px\">\n            <div style=\"display:flex;flex-direction:column;gap:3px\">\n              <div style=\"font-size:17px;font-weight:600\">Medication<\u002Fdiv>\n              <div style=\"font-size:13.5px;color:#6B7280\">Optional — no medications? Skip to the next step.<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"border:1.5px dashed #D9D6CF;border-radius:22px;padding:22px 24px;display:flex;flex-direction:column;gap:12px;background:#fff\">\n              <div style=\"font-family:'JetBrains Mono',monospace;font-size:11.5px;color:#8C8A83;letter-spacing:.04em\">EXISTING MEDICATION MODULE · DROPS IN HERE AS-IS<\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:9px;font-size:14px;line-height:1.5;color:#374151\">\n                <div>• Empty state: “No medications added — tap the button below if this pet needs any”, with a dashed “+ Add medication” button.<\u002Fdiv>\n                <div>• Each medication: name and strength, form (tablet, capsule, liquid, topical), and dose.<\u002Fdiv>\n                <div>• Schedule: times per day (e.g. 8:00 AM and 6:00 PM) and with or without food.<\u002Fdiv>\n                <div>• How it’s given: in a pill pocket, by hand or mixed in food — and whether the facility provides pill pockets (billed per dose).<\u002Fdiv>\n                <div>• Quantity brought by the parent and storage notes.<\u002Fdiv>\n                <div>• With multiple pets: medications are listed per pet.<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <!-- GROOMING PACKAGE -->\n        <sc-if value=\"{{ scrPkg }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:flex;flex-direction:column;gap:18px\">\n            <div style=\"display:flex;flex-direction:column;gap:3px\">\n              <div style=\"font-size:17px;font-weight:600\">Choose the groom<\u002Fdiv>\n              <div style=\"font-size:13.5px;color:#6B7280\">{{ pkgSub }}<\u002Fdiv>\n            <\u002Fdiv>\n            <sc-if value=\"{{ showPetTabs }}\">\n              <div style=\"display:flex;gap:8px;flex-wrap:wrap\">\n                <sc-for list=\"{{ petTabs }}\" as=\"t\">\n                  <button sc-camel-on-click=\"{{ t.onClick }}\" style=\"display:flex;align-items:center;gap:8px;height:42px;padding:0 16px 0 6px;border-radius:999px;border:1px solid {{ t.bd }};background:{{ t.bg }};color:{{ t.color }};cursor:pointer\">\n                    <span style=\"width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.85);color:#1B2333;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700\">{{ t.initial }}<\u002Fspan>\n                    <span style=\"font-size:14px;font-weight:600\">{{ t.name }}<\u002Fspan><span style=\"font-size:12.5px;opacity:.8\">· {{ t.note }}<\u002Fspan>\n                  <\u002Fbutton>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n            <div style=\"display:flex;align-items:center;gap:14px;padding:14px 18px;border-radius:18px;background:{{ accSoft }};flex-wrap:wrap\">\n              <div style=\"display:flex;gap:8px;flex-wrap:wrap;flex:1\">\n                <sc-for list=\"{{ petFacts }}\" as=\"f\"><span style=\"padding:5px 11px;border-radius:999px;background:#fff;font-size:13px;font-weight:600;color:#1B2333\">{{ f }}<\u002Fspan><\u002Fsc-for>\n              <\u002Fdiv>\n              <span style=\"font-size:12.5px;color:{{ accSoftText }};font-weight:500\">Price tier set from pet profile weight and coat<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:14px\">\n              <sc-for list=\"{{ pkgList }}\" as=\"g\" hint-placeholder-count=\"4\">\n                <div sc-camel-on-click=\"{{ g.onClick }}\" style=\"position:relative;display:flex;flex-direction:column;gap:12px;padding:18px 20px;border-radius:22px;background:#fff;border:1.5px solid {{ g.bd }};box-shadow:{{ g.sh }};cursor:pointer;transition:all .15s\">\n                  <div style=\"display:flex;justify-content:space-between;gap:12px;padding-right:30px\">\n                    <div style=\"display:flex;flex-direction:column;gap:3px\"><span style=\"font-size:16.5px;font-weight:600\">{{ g.name }}<\u002Fspan><span style=\"font-size:13px;color:#6B7280;text-wrap:pretty\">{{ g.desc }}<\u002Fspan><\u002Fdiv>\n                  <\u002Fdiv>\n                  <div style=\"display:flex;justify-content:space-between;align-items:flex-end;gap:8px\">\n                    <div style=\"display:flex;flex-direction:column\"><span style=\"font-size:24px;font-weight:700;letter-spacing:-0.02em\">{{ g.price }}<\u002Fspan><span style=\"font-size:12px;color:#6B7280\">{{ g.priceNote }}<\u002Fspan><\u002Fdiv>\n                    <span style=\"padding:5px 11px;border-radius:999px;background:#F4F3EF;font-size:12.5px;font-weight:600\">◷ {{ g.dur }}<\u002Fspan>\n                  <\u002Fdiv>\n                  <div style=\"display:flex;gap:4px;padding-top:10px;border-top:1px solid #F1EFEA\">\n                    <sc-for list=\"{{ g.tiers }}\" as=\"t\"><span style=\"flex:1;text-align:center;padding:5px 0;border-radius:10px;background:{{ t.bg }};color:{{ t.color }};font-size:12px;font-weight:{{ t.fw }}\">{{ t.label }}<\u002Fspan><\u002Fsc-for>\n                  <\u002Fdiv>\n                  <div style=\"position:absolute;top:16px;right:16px;width:24px;height:24px;border-radius:50%;background:{{ acc }};color:{{ accText }};display:{{ g.ck }};align-items:center;justify-content:center;font-size:13px;font-weight:700\">✓<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <sc-if value=\"{{ isFac }}\">\n              <div sc-camel-on-click=\"{{ toggleMatting }}\" style=\"display:flex;align-items:center;gap:14px;padding:14px 18px;border-radius:18px;background:#fff;border:1px solid #ECEAE4;cursor:pointer;max-width:560px\">\n                <div style=\"flex:1;display:flex;flex-direction:column\"><span style=\"font-size:14px;font-weight:600\">{{ mattingLabel }}<\u002Fspan><span style=\"font-size:12.5px;color:#6B7280\">Adds $20 and 15 min — staff only, set at intake<\u002Fspan><\u002Fdiv>\n                <div style=\"width:40px;height:24px;border-radius:99px;background:{{ matBg }};position:relative;transition:background .2s\"><div style=\"position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transform:translateX({{ matX }});transition:transform .2s\"><\u002Fdiv><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ isCus }}\"><div style=\"font-size:12.5px;color:#6B7280\">Estimated price — your groomer confirms the final price at check-in (matting or behaviour can change it).<\u002Fdiv><\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <!-- TRAINING PROGRAM -->\n        <sc-if value=\"{{ scrProgram }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:flex;flex-direction:column;gap:18px;max-width:1000px\">\n            <div style=\"display:flex;flex-direction:column;gap:3px\">\n              <div style=\"font-size:17px;font-weight:600\">Choose a program<\u002Fdiv>\n              <div style=\"font-size:13.5px;color:#6B7280\">Prices are per pet.<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,280px),1fr));gap:14px\">\n              <sc-for list=\"{{ programs }}\" as=\"g\" hint-placeholder-count=\"3\">\n                <div sc-camel-on-click=\"{{ g.onClick }}\" style=\"position:relative;display:flex;flex-direction:column;gap:10px;padding:20px;border-radius:22px;background:#fff;border:1.5px solid {{ g.bd }};box-shadow:{{ g.sh }};cursor:pointer\">\n                  <span style=\"font-size:16.5px;font-weight:600;padding-right:28px\">{{ g.name }}<\u002Fspan>\n                  <span style=\"font-size:13px;color:#6B7280;text-wrap:pretty\">{{ g.desc }}<\u002Fspan>\n                  <div style=\"display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:10px;border-top:1px solid #F1EFEA\"><span style=\"font-size:15px;font-weight:700\">{{ g.priceLabel }}<\u002Fspan><span style=\"font-size:12.5px;color:#6B7280\">{{ g.meta }}<\u002Fspan><\u002Fdiv>\n                  <div style=\"position:absolute;top:18px;right:18px;width:24px;height:24px;border-radius:50%;background:{{ acc }};color:{{ accText }};display:{{ g.ck }};align-items:center;justify-content:center;font-size:13px;font-weight:700\">✓<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <sc-if value=\"{{ isPrivate }}\">\n              <div style=\"display:flex;flex-direction:column;gap:10px\">\n                <div style=\"font-size:11.5px;font-weight:600;letter-spacing:.07em;color:#6B7280\">SESSIONS<\u002Fdiv>\n                <div style=\"display:flex;gap:8px;flex-wrap:wrap\">\n                  <sc-for list=\"{{ packs }}\" as=\"o\"><button sc-camel-on-click=\"{{ o.onClick }}\" style=\"display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:10px 16px;border-radius:16px;border:1.5px solid {{ o.bd }};background:{{ o.bg }};cursor:pointer;color:#1B2333\"><span style=\"font-size:14px;font-weight:600\">{{ o.label }}<\u002Fspan><span style=\"font-size:12px;color:#6B7280\">{{ o.sub }}<\u002Fspan><\u002Fbutton><\u002Fsc-for>\n                <\u002Fdiv>\n                <div style=\"font-size:12.5px;color:#6B7280\">You’ll book the first session now — the rest can be scheduled from the booking page.<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <!-- COHORTS -->\n        <sc-if value=\"{{ scrCohort }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:flex;flex-direction:column;gap:16px;max-width:900px\">\n            <div style=\"display:flex;flex-direction:column;gap:3px\">\n              <div style=\"font-size:17px;font-weight:600\">Pick a class<\u002Fdiv>\n              <div style=\"font-size:13.5px;color:#6B7280\">Group classes run weekly for 6 weeks · max 6 dogs per class.<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:10px\">\n              <sc-for list=\"{{ cohorts }}\" as=\"c\" hint-placeholder-count=\"4\">\n                <div sc-camel-on-click=\"{{ c.onClick }}\" style=\"display:flex;align-items:center;gap:16px;padding:16px 20px;border-radius:20px;background:#fff;border:1.5px solid {{ c.bd }};box-shadow:{{ c.sh }};cursor:{{ c.cursor }};opacity:{{ c.op }};flex-wrap:wrap\">\n                  <div style=\"width:56px;height:56px;border-radius:16px;background:#F4F3EF;display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0\"><span style=\"font-size:10.5px;font-weight:700;color:#6B7280\">{{ c.mon }}<\u002Fspan><span style=\"font-size:19px;font-weight:700\">{{ c.day }}<\u002Fspan><\u002Fdiv>\n                  <div style=\"flex:1;min-width:200px;display:flex;flex-direction:column;gap:2px\"><span style=\"font-size:15.5px;font-weight:600\">{{ c.name }}<\u002Fspan><span style=\"font-size:13px;color:#6B7280\">{{ c.when }} · with {{ c.trainer }}<\u002Fspan><\u002Fdiv>\n                  <span style=\"padding:5px 12px;border-radius:999px;background:{{ c.pillBg }};color:{{ c.pillColor }};font-size:12.5px;font-weight:600\">{{ c.spots }}<\u002Fspan>\n                  <div style=\"width:24px;height:24px;border-radius:50%;background:{{ acc }};color:{{ accText }};display:{{ c.ck }};align-items:center;justify-content:center;font-size:13px;font-weight:700\">✓<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <!-- STAFF SCHEDULER (grooming + training) -->\n        <sc-if value=\"{{ scrSched }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:flex;flex-direction:column;gap:18px\">\n            <div style=\"display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap\">\n              <div style=\"display:flex;flex-direction:column;gap:3px\">\n                <div style=\"font-size:17px;font-weight:600\">{{ schedTitle }}<\u002Fdiv>\n                <div style=\"font-size:13.5px;color:#6B7280\">{{ schedSub }}<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display:flex;gap:4px;padding:4px;background:#F1EFEA;border-radius:999px\">\n                <sc-for list=\"{{ modeOpts }}\" as=\"o\"><button sc-camel-on-click=\"{{ o.onClick }}\" style=\"height:36px;padding:0 16px;border-radius:999px;border:none;background:{{ o.bg }};color:#1B2333;box-shadow:{{ o.sh }};font-size:13.5px;font-weight:600;cursor:pointer\">{{ o.label }}<\u002Fbutton><\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <sc-if value=\"{{ showEarliest }}\">\n              <div style=\"display:flex;align-items:center;gap:16px;padding:16px 20px;border-radius:20px;background:{{ accSoft }};flex-wrap:wrap\">\n                <div style=\"flex:1;min-width:220px;display:flex;flex-direction:column;gap:2px\"><span style=\"font-size:11.5px;font-weight:700;letter-spacing:.07em;color:{{ accSoftText }}\">EARLIEST OPENING<\u002Fspan><span style=\"font-size:15.5px;font-weight:600\">{{ earliestLabel }}<\u002Fspan><\u002Fdiv>\n                <button sc-camel-on-click=\"{{ takeEarliest }}\" style=\"height:40px;padding:0 20px;border-radius:999px;border:none;background:{{ acc }};color:{{ accText }};font-size:14px;font-weight:600;cursor:pointer;box-shadow:0 8px 20px -8px {{ accGlow }}\">Take this slot<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <sc-if value=\"{{ showStaff }}\">\n              <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr));gap:10px\">\n                <sc-for list=\"{{ staffCards }}\" as=\"g\">\n                  <div sc-camel-on-click=\"{{ g.onClick }}\" style=\"display:flex;gap:12px;align-items:center;padding:14px 16px;border-radius:18px;background:#fff;border:1.5px solid {{ g.bd }};box-shadow:{{ g.sh }};cursor:pointer\">\n                    <div style=\"width:44px;height:44px;border-radius:50%;background:repeating-linear-gradient(135deg,#EFEDE8 0 5px,#F7F6F2 5px 10px);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:#4B5563;flex-shrink:0\">{{ g.initials }}<\u002Fdiv>\n                    <div style=\"display:flex;flex-direction:column;gap:1px;min-width:0\"><span style=\"font-size:14.5px;font-weight:600\">{{ g.name }}<\u002Fspan><span style=\"font-size:12.5px;color:#6B7280\">{{ g.role }}<\u002Fspan><span style=\"font-size:12px;font-weight:600;color:{{ accDeep }}\">{{ g.next }}<\u002Fspan><\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <sc-if value=\"{{ hasExcluded }}\"><div style=\"font-size:12.5px;color:#6B7280\">{{ excludedNote }}<\u002Fdiv><\u002Fsc-if>\n            <\u002Fsc-if>\n\n            <div style=\"background:#fff;border:1px solid #ECEAE4;border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:16px\">\n              <div style=\"display:{{ stripDisplay }};grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:2px\">\n                <sc-for list=\"{{ dayStrip }}\" as=\"d\" hint-placeholder-count=\"14\">\n                  <div sc-camel-on-click=\"{{ d.onClick }}\" style=\"display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 4px;min-width:{{ stripItemMin }};flex-shrink:0;border-radius:14px;border:1.5px solid {{ d.bd }};background:{{ d.bg }};color:{{ d.color }};cursor:{{ d.cursor }};opacity:{{ d.op }}\">\n                    <span style=\"font-size:11px;font-weight:600;opacity:.8\">{{ d.dow }}<\u002Fspan>\n                    <span style=\"font-size:17px;font-weight:700\">{{ d.dnum }}<\u002Fspan>\n                    <span style=\"font-size:10.5px;font-weight:600;opacity:.85\">{{ d.count }}<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:10px;padding-top:14px;border-top:1px solid #F1EFEA\">\n                <div style=\"display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap\"><span style=\"font-size:14px;font-weight:600\">{{ slotsTitle }}<\u002Fspan><span style=\"font-size:12.5px;color:#6B7280\">{{ durNote }}<\u002Fspan><\u002F
