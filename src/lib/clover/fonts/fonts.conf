<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  Fontconfig for the receipt renderer.

  Vercel's serverless runtime ships no system fonts. Without this, librsvg
  renders every glyph as the "missing glyph" box — and a receipt of empty
  rectangles printed on a Clover Flex on 2026-08-19 is what proved it. The
  earlier blank-page guard did not catch it, because tofu boxes are ink.

  The directory is resolved at runtime and injected before this file is read;
  see FONT_DIR in receipt-image.ts.
-->
<fontconfig>
  <dir prefix="default">.</dir>
  <cachedir prefix="default">fontconfig</cachedir>
  <match target="pattern">
    <test qual="any" name="family"><string>monospace</string></test>
    <edit name="family" mode="assign" binding="same"><string>Roboto Mono</string></edit>
  </match>
  <alias>
    <family>sans-serif</family>
    <prefer><family>Roboto Mono</family></prefer>
  </alias>
</fontconfig>
